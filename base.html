<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GESTELL{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script>
    // Apply saved theme before render to avoid flash (GESTELL: dark #030303 default)
    (function() {
      var t = localStorage.getItem('gestell-theme') || 'dark';
      // Migrate legacy keys -> canonical dark
      if (t === 'dark-blue' || t === 'dark-green') { t = 'dark'; localStorage.setItem('gestell-theme', t); }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar-app">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <img id="navbar-logo"
             src="/static/Gestell_Isotipo_Wordmark_Crema_DarkMode.svg"
             alt="Gestell"
             class="navbar-logo">
      </a>
      <div class="navbar-links">
        <a href="/" class="navbar-link {% block nav_dashboard %}{% endblock %}">Dashboard</a>
        <a href="/procesar" class="navbar-link {% block nav_procesar %}{% endblock %}">Areas</a>
        <a href="/gnosisia" class="navbar-link {% block nav_gnosisia %}{% endblock %}">Gnosis AI</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer style="display:flex;align-items:center;padding:0 1rem;">
    <div class="theme-selector">
      <button class="theme-dot" data-theme="dark"  style="background:#030303;" title="Oscuro"></button>
      <button class="theme-dot" data-theme="light" style="background:#FAFAF8;" title="Claro"></button>
    </div>
    <span style="flex:1;text-align:center;">Gestell 2025 &reg;</span>
  </footer>

  {% block scripts %}{% endblock %}
  <script>
    // Logos canónicos (Brandbook §3.1) — SVG por modo, singulo #00D4FF en ambos, sin filtros
    const LOGO_LIGHT = '/static/Gestell_Isotipo_Wordmark_Color.svg';
    const LOGO_DARK  = '/static/Gestell_Isotipo_Wordmark_Crema_DarkMode.svg';

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t === 'light' ? 'light' : 'dark');

      var logo = document.getElementById('navbar-logo');
      if (logo) {
        logo.src = (t === 'light') ? LOGO_LIGHT : LOGO_DARK;
        logo.style.filter = '';
      }

      document.querySelectorAll('.theme-dot').forEach(function(dot) {
        dot.classList.toggle('active', dot.getAttribute('data-theme') === t);
      });
    }

    // Init (default dark canónico)
    (function() {
      var saved = localStorage.getItem('gestell-theme') || 'dark';
      if (saved === 'dark-blue' || saved === 'dark-green') saved = 'dark';
      applyTheme(saved);
    })();

    // Click handler
    document.querySelectorAll('.theme-dot').forEach(function(dot) {
      dot.addEventListener('click', function() {
        var t = this.getAttribute('data-theme');
        localStorage.setItem('gestell-theme', t);
        applyTheme(t);
      });
    });
  </script>
</body>
</html>
