<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VW Aduanas{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script>
    // Apply saved theme before render to avoid flash
    (function() {
      var t = localStorage.getItem('gestell-theme') || 'light';
      // Migrate old keys to current themes
      if (t === 'dark' || t === 'dark-green') { t = 'dark-blue'; localStorage.setItem('gestell-theme', t); }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar-app">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <img id="navbar-logo"
             src="/static/Gestell_Isotipo_Wordmark_Color.svg"
             alt="Gestell"
             class="navbar-logo">
      </a>
      <div class="navbar-links">
        <a href="/" class="navbar-link {% block nav_dashboard %}{% endblock %}">Dashboard</a>
        <a href="/procesar" class="navbar-link {% block nav_procesar %}{% endblock %}">Areas</a>
        <a href="/gnosisia" class="navbar-link {% block nav_gnosisia %}{% endblock %}">Gnosis AI</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer style="display:flex;align-items:center;padding:0 1rem;">
    <div class="theme-selector">
      <button class="theme-dot" data-theme="light"     style="background:#FFFFFF;" title="Claro"></button>
      <button class="theme-dot" data-theme="dark-blue" style="background:#0A1628;" title="Oscuro"></button>
    </div>
    <span style="flex:1;text-align:center;">Gestell 2025 &reg;</span>
  </footer>

  {% block scripts %}{% endblock %}
  <script>
    const LOGO_COLOR = '/static/Gestell_Isotipo_Wordmark_Color.svg';

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);

      // Logo: color SVG for light, white (via filter) for dark themes
      var logo = document.getElementById('navbar-logo');
      if (logo) {
        logo.src = LOGO_COLOR;
        logo.style.filter = (t === 'light') ? '' : 'brightness(0) invert(1)';
      }

      // Update dot active state
      document.querySelectorAll('.theme-dot').forEach(function(dot) {
        dot.classList.toggle('active', dot.getAttribute('data-theme') === t);
      });
    }

    // Init
    (function() {
      var saved = localStorage.getItem('gestell-theme') || 'light';
      if (saved === 'dark') saved = 'dark-blue';
      applyTheme(saved);
    })();

    // Click handler
    document.querySelectorAll('.theme-dot').forEach(function(dot) {
      dot.addEventListener('click', function() {
        var t = this.getAttribute('data-theme');
        localStorage.setItem('gestell-theme', t);
        applyTheme(t);
      });
    });
  </script>
</body>
</html>
