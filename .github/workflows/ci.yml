name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # la compuerta de staleness compara contra el commit anterior
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      # Flask/Werkzeug van PINEADOS a lo que instala requirements.txt: sin el
      # pin, CI probaba el ultimo Flask mientras la imagen del operador corria
      # 2.0.3, asi que la compuerta verde no decia nada sobre lo que el operador
      # ejecuta. El resto queda flotante a proposito (son deps de prueba).
      - name: Dependencias
        # `-c requirements.txt` es el punto: CI instala el subconjunto que
        # necesita, en las versiones que instala la imagen. Sin esto la
        # suite pasa contra un programa que no es el desplegado.
        run: |
          pip install -c requirements.txt \
            flask pydantic networkx python-dotenv requests \
            pandas numpy openpyxl xlrd anthropic \
            'pytest==8.4.2' 'ruff==0.16.6' 'pip-audit==2.10.1' 'mypy==2.3.1'
      # El alcance lo declara ruff.toml (exclude = pipelegado + scripts
      # legados), no la lista de arriba: una lista escrita a mano olvidaba
      # database/, que la config sí considera árbol vivo.
      - name: Lint (el árbol vivo; ruff.toml define qué queda fuera)
        run: ruff check .
      - name: Types (the list in mypy.ini only shrinks)
        run: mypy
      - name: Dependencias sin vulnerabilidades conocidas
        run: pip-audit -r requirements.txt --strict
      - name: Suite
        run: python -m pytest -q

      # Dependencias — benchmark §13 de backend-engineering.md.
      # HARD: cualquier vulnerabilidad NUEVA rompe el build. Las dos ignoradas
      # son PyPDF2 1.26.0, que solo usa el pipelegado intocable y cuyo salto es
      # decision del operador con PDFs reales delante (ver requirements.txt).
      # Excepcion declarada y acotada, no una compuerta desactivada.
      - name: Dependencias (pip-audit)
        run: |
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2022-194 --ignore-vuln PYSEC-2026-1837

      # Compuertas de arquitectura — docs/estandares/architecture-standards.md §7.
      # mermaid+jsdom se instalan aqui (no hay package.json en el repo: el
      # frontend no tiene build step, ADR-0008) para que el validador haga el
      # parseo real y no solo el pre-vuelo estructural.
      - name: Dependencias de diagramas
        run: npm install --no-save --no-fund --no-audit mermaid jsdom
      - name: Diagramas (cabeceras + parseo Mermaid)
        run: node scripts/validate-mermaid.mjs docs/architecture
      # Sin bundler que revise nada (ADR-0008), un innerHTML que interpola en
      # un archivo sin `esc` a mano solo se descubre en el navegador del
      # operador. HARD el archivo sin escape; SOFT la linea sospechosa.
      - name: Escape en innerHTML (frontend)
        run: node scripts/check-innerhtml.mjs
      - name: Staleness de diagramas
        # En un PR: contra la base. En un push: contra el estado ANTERIOR del
        # remoto, no contra HEAD~1 — un push de varios commits solo revisaria
        # el ultimo. Rama nueva (before = ceros) o historial ausente: el script
        # lo detecta y se omite en vez de romper.
        run: node scripts/check-diagram-staleness.mjs --base ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
