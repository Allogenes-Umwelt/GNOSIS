name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          pip install flask pydantic networkx python-dotenv requests \
            pandas numpy pytest ruff \
            openpyxl 'xlrd>=2.0.1' anthropic
      # El alcance lo declara ruff.toml (exclude = pipelegado + scripts
      # legados), no esta lista: la anterior olvidaba database/, que la
      # config sí considera árbol vivo.
      - name: Lint
        run: ruff check .
      - name: Suite
        run: python -m pytest -q
