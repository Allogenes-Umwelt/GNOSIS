name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          pip install flask pydantic networkx python-dotenv requests \
            pandas numpy openpyxl 'xlrd>=2.0.1' anthropic \
            'pytest==8.4.2' 'ruff==0.16.6'
      - name: Lint (el árbol vivo; ruff.toml define qué queda fuera)
        run: ruff check .
      - name: Suite
        run: python -m pytest -q
