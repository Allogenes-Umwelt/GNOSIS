# Ruff config. Los defaults (E4/E7/E9/F) aplican al código MANTENIDO; el
# pipelegado y los scripts legados de raíz quedan fuera del lint a propósito
# (LEY: el pipelegado no se toca, así que no debe generar ruido permanente).

# El árbol vivo que sí linteamos: app.py + los paquetes autogenes/, rutas/,
# tableros/, database/, jarvis/, y tests/. Todo lo de abajo se excluye.
exclude = [
    # ── pipelegado intocable (LEY) ──
    "concentrado1.py",
    "concentrado2.py",
    "Estadistico.py",
    "PDFs_Final_v3.py",
    "PDFs_v2.py",
    # ── scripts legados de raíz (no mantenidos) ──
    "archivos.py",
    "boat_analysis.py",
    "celda.py",
    "envtest.py",
    "newestadistico.py",
    "preprocesoCORRECTO.py",
    "preprocesoIncrementablesDivisionesDEPRECACTED.py",
    "test.py",
    # ── notebooks de exploración (no son código de producción) ──
    "*.ipynb",
]

[lint]
# La selección se DECLARA aquí en vez de heredar el default de la versión de
# ruff instalada. El default no es un contrato: una versión nueva lo amplía y
# la CI se pone roja sin un solo cambio de código (pasó el 2026-08-23: el
# commit de SOLO documentación `95c2c76` disparó 313 errores de reglas que
# este árbol nunca seleccionó). El gate obedece la misma ley que el render:
# mismo árbol, mismo veredicto, corra donde corra y con la ruff que sea.
#
# E4 (imports) · E7 (sentencias) · E9 (sintaxis/IO) · F (pyflakes) — el
# conjunto que este repo ha linteado desde siempre, ahora explícito.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# app.py llama load_dotenv() ANTES de importar módulos que leen variables
# de entorno al importarse (.env debe poblarse primero). Ese orden es
# intencional, así que E402 (import no al inicio) no aplica aquí.
"app.py" = ["E402"]
