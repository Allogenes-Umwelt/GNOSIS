# Ruff config. Los defaults (E4/E7/E9/F) aplican al código MANTENIDO; el
# pipelegado y los scripts legados de raíz quedan fuera del lint a propósito
# (LEY: el pipelegado no se toca, así que no debe generar ruido permanente).

# El árbol vivo que sí linteamos: app.py + los paquetes autogenes/, rutas/,
# tableros/, database/, jarvis/, y tests/. Todo lo de abajo se excluye.
exclude = [
    # ── pipelegado intocable (LEY) ──
    "concentrado1.py",
    "concentrado2.py",
    "Estadistico.py",
    "PDFs_Final_v3.py",
    "PDFs_v2.py",
    # ── scripts legados de raíz (no mantenidos) ──
    "archivos.py",
    "boat_analysis.py",
    "celda.py",
    "envtest.py",
    "newestadistico.py",
    "preprocesoCORRECTO.py",
    "preprocesoIncrementablesDivisionesDEPRECACTED.py",
    "test.py",
    # ── notebooks de exploración (no son código de producción) ──
    "*.ipynb",
]

[lint.per-file-ignores]
# app.py llama load_dotenv() ANTES de importar módulos que leen variables
# de entorno al importarse (.env debe poblarse primero). Ese orden es
# intencional, así que E402 (import no al inicio) no aplica aquí.
"app.py" = ["E402"]

[lint]
# Ruff's defaults are not a stable contract. This config relied on them
# implicitly, and when CI's unpinned `pip install ruff` picked up 0.16 --
# which widened the default selection -- a docs-only commit went from a
# clean gate to 313 findings. Nothing in the repository had changed.
#
# The selection below is the one the config always meant (E4/E7/E9/F:
# correctness, not style, per the note at the top of this file). Stated
# explicitly, the gate answers the same under any ruff version, and
# widening it becomes a decision someone makes rather than one a release
# makes for us.
select = ["E4", "E7", "E9", "F"]
