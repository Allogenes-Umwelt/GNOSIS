# The floor of `backend-engineering` §9 Types: a checker runs in CI over a
# list of untyped modules that ONLY shrinks. The list is below and holds
# twelve entries; to remove one, fix its errors and delete the line.
# Adding one is a change somebody has to defend in review, and that is the
# whole mechanism.
#
# Not `strict`: the benchmark's elite asks for that and the list asks for
# this. Starting from strict over 16k untyped lines produces a gate that
# gets switched off in a fortnight.

[mypy]
python_version = 3.11
ignore_missing_imports = True
# The pipelegado is not touched (LEY) and the legacy root scripts are not
# maintained: both stay out, exactly as in ruff.toml.
files = app.py, rutas, autogenes, tableros, jarvis, database

# -- the list that only shrinks --
[mypy-autogenes.proyeccion]
ignore_errors = True

[mypy-autogenes.control]
ignore_errors = True

[mypy-autogenes.extraccion]
ignore_errors = True

[mypy-autogenes.concilia]
ignore_errors = True

[mypy-autogenes.caminos]
ignore_errors = True

[mypy-autogenes.sinapsis]
ignore_errors = True

[mypy-autogenes.disposiciones]
ignore_errors = True

[mypy-tableros.rutas]
ignore_errors = True

[mypy-tableros.rechazos]
ignore_errors = True

[mypy-tableros.dominio]
ignore_errors = True

[mypy-jarvis.chat_handler]
ignore_errors = True

[mypy-database]
ignore_errors = True
