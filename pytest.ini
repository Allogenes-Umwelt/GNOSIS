[pytest]
# `slow`: el banco de escala (tests/test_escala.py). Corre en la suite normal
# —una compuerta que no corre no es una compuerta— y se puede saltar al iterar
# con `-m "not slow"`. Afirma RATIOS, no segundos: CI no es un banco de pruebas.
markers =
    slow: pruebas de escala (segundos, no milisegundos)
